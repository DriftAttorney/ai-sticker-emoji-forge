[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sticker-emoji-forge"
version = "0.4.2"
description = "Windows desktop toolkit that forges stickers and emoji packs from prompts, photos, or reference art using local diffusion + rembg."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "potato-forge maintainers", email = "forge@ai-sticker-emoji-forge.dev" }]
keywords = ["sticker", "emoji", "diffusion", "rembg", "wxpython", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "Pillow>=10.2",
    "rembg>=2.0.50",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "rich>=13.7",
    "wxPython>=4.2.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.4", "mypy>=1.9", "black>=24.3"]
cuda = ["torch>=2.2+cu121"]
cpu = ["torch>=2.2"]

[project.scripts]
sticker-forge = "stickerforge.app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"